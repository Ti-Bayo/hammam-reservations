{% extends "base.html" %}
{% block contenu %}
  <h1>Les Bains d’Argile</h1>
  <p class="lead">Réservez votre soin en quelques clics.</p>

  <table class="table table-striped">
    <thead>
      <tr><th>Service</th><th>Durée</th><th>Prix</th></tr>
    </thead>
    <tbody>
      {% for s in services %}
        <tr>
          <td>{{ s.nom }}</td>
          <td>{{ s.duree_minutes }} min</td>
          <td>{{ "%.2f"|format(s.prix_cents / 100) }} $</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
